<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Retro Monitor</title>
		<link rel="stylesheet" href="style.css" />
		<script defer src="script.js"></script>
	</head>

	<body>
		<div class="monitor_frame">
			<img class="monitor_overlay" src="resources/monitor.png">
			<div class="screen">
				<div id="menu_start" class="menu hidden">
					<div class="menu_item" data-window="1">
						<img src="resources/menu/icons/icon 1.png" class="icon">
						<span class="item_text">Icon 1</span>
					</div>
					<div class="menu_item" data-window="2">
						<img src="resources/menu/icons/icon 2.png" class="icon">
						<span class="item_text">Icon 2</span>
					</div>
					<div class="menu_item" data-window="3">
						<img src="resources/menu/icons/icon 3.png" class="icon">
						<span class="item_text">Icon 3</span>
					</div>
					<div class="menu_item" data-window="4">
						<img src="resources/menu/icons/icon 4.png" class="icon">
						<span class="item_text">Icon 4</span>
					</div>
					<!-- <img src="resources/menu/start/background.png" class="menu_background"> -->
				</div>
				<div class="taskbar_background">
					<img src="resources/taskbar/start.png" id="start" class="menu_item root"
						data-menu="menu_start">
					<img src="resources/taskbar/div.png">
					<img src="resources/taskbar/end.png" style="position: absolute;right : 0;">
				</div>
			</div>
			<div class="window hidden" data-window_id="1">
				<iframe src="flappy bird/index.html" style="width: 100%; height: 100%;"></iframe>
			</div>
			<iframe src="flappy bird/index.html" class="window hidden"
				data-window_id="2"></iframe>
			<iframe src="flappy bird/index.html" class="window hidden"
				data-window_id="3"></iframe>
			<iframe src="flappy bird/index.html" class="window hidden"
				data-window_id="4"></iframe>
		</div>
	</body>

</html>
