<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Retro Monitor</title>
		<link rel="stylesheet" href="style.css" />
		<script defer src="script.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
		<script src="audio.js"></script>
	</head>

	<body>

		<div class="monitor_frame">
			<img class="monitor_overlay" src="resources/monitor.png">
			<div class="screen">
				<div id="menu_start" class="menu hidden">
					<div class="menu_item" data-window="flappybird">
						<img src="resources/menu/icons/icon 1.png" class="icon">
						<span class="item_text">Icon 1</span>
					</div>
					<div class="menu_item" data-window="randomware">
						<img src="resources/menu/icons/icon 2.png" class="icon">
						<span class="item_text">Icon 2</span>
					</div>
					<div class="menu_item" data-window="nose">
						<img src="resources/menu/icons/icon 3.png" class="icon">
						<span class="item_text">Icon 3</span>
					</div>
				</div>
				<div class="taskbar_background">
					<img src="resources/taskbar/start.png" id="start" class="menu_item root"
						data-menu="menu_start">
					<img src="resources/taskbar/div.png">
					<img src="resources/taskbar/end.png" style="position: absolute;right : 0;">
				</div>
				<div id = 'window_randomware' class="hidden" tabindex="0" style="width: 100%; height: 100%; pointer-events: all; ">
					<script src="randomware/script.js"></script>
					<link rel="stylesheet" href="randomware/style.css">
				</div>
			</div>
			<div id ='window_flappybird' class="window hidden">
				<div id="game-container">
					<div id="bird"></div>
					<div id="score">0</div>
				</div>
				<script src="flappy bird/script.js"></script>
				<link rel="stylesheet" href="flappy bird/style.css">
			</div>
			<div id = 'window_nose' class="window hidden">
				<div id="score_nose">0</div>
				<div id="game_container_nose">
						
				</div>
				<div class="nose_hole" style="position:absolute; top: 19%; left: 49%; width:8%; height: 9%;"></div>
				<div class="nose_hole" style="position:absolute; top: 30%; left: 43%; width:5%; height: 14%;"></div>
				<img src="nose/resources/amy.jpg" style="width: 100%; height:100%;">
				<script src="nose/script.js"></script>
				<link rel="stylesheet" href="nose/style.css">
			</div>
		</div>
	</body>

</html>
